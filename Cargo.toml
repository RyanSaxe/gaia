[workspace]
members = ["engine"]
resolver = "3"

# The app and the tests run a debug engine, so the debug profile lightly
# optimizes the engine and its dependencies, above all tree-sitter's C parsers.
# On Gaia a judged graph takes about 1 s instead of 6 to 9, at the cost of a
# clean build of 28 s instead of 19 and an edit's rebuild of about 2 s instead
# of 1. Fully optimizing the dependencies gained nothing more.
[profile.dev]
opt-level = 1

[workspace.lints.rust]
# Avoid unsafe unless a crate explicitly requires FFI or low-level invariants.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Priority -1 lets individual lint overrides below win over the group level.
pedantic = { level = "warn", priority = -1 }
# Clippy's quadratic nesting penalty makes cognitive complexity <= 15
# (set in clippy.toml) equivalent to Python C901 <= 8 and JS/TS complexity <= 10.
cognitive_complexity = "warn"
# Propagate errors with `?` or handle them explicitly instead of panicking.
unwrap_used = "deny"
# Reserve `expect` for invariants that cannot fail, with a short reason.
expect_used = "warn"
