<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Gaia runtime boundaries</title>
  <desc id="desc">Electron main starts the world service, renderer and Rust engine. Main relays engine requests. The world service sends a WorldDocument and events to the renderer over a MessagePort. The Rust engine reads the repository and project store, and sends Jev requests to OpenRouter.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7e8a80"/></marker>
    <marker id="start-arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8 0L0 4L8 8Z" fill="#7e8a80"/></marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f654b"/></marker>
    <marker id="green-start" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8 0L0 4L8 8Z" fill="#2f654b"/></marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#54778f"/></marker>
    <style>
      text { font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#202923; }
      .frame { fill:#f5f6f0; stroke:#cdd5cb; stroke-width:1.5; stroke-dasharray:6 6; }
      .node { fill:#fff; stroke:#d4dbd2; stroke-width:1.5; }
      .green { fill:#e2eee4; stroke:#bbd1bf; }
      .blue { fill:#e6edf1; stroke:#c6d4dd; }
      .ochre { fill:#f2eadb; stroke:#dfceb0; }
      .purple { fill:#eee8f2; stroke:#d8cde1; }
      .label { font-size:12px; font-weight:750; letter-spacing:1.2px; fill:#657268; }
      .name { font-size:20px; font-weight:700; }
      .sub { font-size:14px; fill:#5e6a61; }
      .note { font-size:14px; fill:#657268; }
      .edge { fill:none; stroke:#7e8a80; stroke-width:2; }
      .green-edge { fill:none; stroke:#2f654b; stroke-width:2; }
      .blue-edge { fill:none; stroke:#54778f; stroke-width:2; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#fbfaf5"/>
  <text class="label" x="48" y="38">PROCESSES AND MESSAGE BOUNDARIES</text>
  <rect class="frame" x="40" y="66" width="630" height="410" rx="18"/>
  <text class="label" x="64" y="96">ELECTRON APP</text>

  <path class="edge" d="M380 227L300 155" marker-start="url(#start-arrow)" marker-end="url(#arrow)"/>
  <path class="edge" d="M380 280L300 355" marker-start="url(#start-arrow)" marker-end="url(#arrow)"/>
  <path class="edge" d="M580 255H800" marker-start="url(#start-arrow)" marker-end="url(#arrow)"/>
  <path class="green-edge" d="M190 190V320" marker-start="url(#green-start)" marker-end="url(#green-arrow)"/>
  <path class="blue-edge" d="M1000 220L1035 150" marker-end="url(#blue-arrow)"/>
  <path class="edge" d="M1000 290L1035 365" marker-end="url(#arrow)"/>

  <rect class="node green" x="80" y="100" width="220" height="90" rx="12"/>
  <text class="label" x="100" y="126">UTILITY PROCESS</text>
  <text class="name" x="100" y="155">World service</text>
  <text class="sub" x="100" y="176">facts · questions · document</text>

  <rect class="node purple" x="80" y="320" width="220" height="90" rx="12"/>
  <text class="label" x="100" y="346">WINDOW</text>
  <text class="name" x="100" y="375">Renderer</text>
  <text class="sub" x="100" y="396">world · terrain · journal</text>

  <rect class="node" x="380" y="210" width="200" height="90" rx="12"/>
  <text class="label" x="400" y="236">MAIN PROCESS</text>
  <text class="name" x="400" y="265">Electron Main</text>
  <text class="sub" x="400" y="286">lifecycle · relay</text>

  <rect class="node blue" x="800" y="210" width="200" height="90" rx="12"/>
  <text class="label" x="820" y="236">CHILD PROCESS</text>
  <text class="name" x="820" y="265">Rust engine</text>
  <text class="sub" x="820" y="286">graph · store · Jev</text>

  <rect class="node ochre" x="1035" y="84" width="150" height="66" rx="12"/>
  <text class="label" x="1052" y="109">HTTPS</text>
  <text class="name" x="1052" y="135">OpenRouter</text>

  <rect class="node" x="1035" y="365" width="150" height="76" rx="12"/>
  <text class="label" x="1052" y="390">FILES</text>
  <text class="name" x="1052" y="416">Repo + store</text>

  <rect x="306" y="176" width="76" height="21" rx="5" fill="#fbfaf5"/>
  <text class="note" x="312" y="191">fork · IPC</text>
  <rect x="306" y="310" width="65" height="21" rx="5" fill="#fbfaf5"/>
  <text class="note" x="312" y="325">window</text>
  <rect x="623" y="233" width="124" height="22" rx="5" fill="#fbfaf5"/>
  <text class="note" x="629" y="249">JSON-RPC relay</text>
  <rect x="201" y="244" width="102" height="22" rx="5" fill="#fbfaf5"/>
  <text class="note" x="207" y="260">MessagePort</text>
  <rect x="984" y="160" width="64" height="21" rx="5" fill="#fbfaf5"/>
  <text class="note" x="990" y="175">Jev API</text>
  <rect x="983" y="308" width="90" height="21" rx="5" fill="#fbfaf5"/>
  <text class="note" x="989" y="323">read · write</text>
</svg>
