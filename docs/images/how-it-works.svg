<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 255" width="960" height="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #f6f1e4; stroke: #8a7458; stroke-width: 1.5; }
    .jev { fill: #e7efdc; stroke: #5f8a3e; }
    .t { fill: #2b2721; font-size: 17px; font-weight: 600; }
    .s { fill: #5c5246; font-size: 13px; }
    .a { stroke: #8a7458; stroke-width: 2; fill: none; }
    .h { fill: #8a7458; }
    .l { fill: #5f8a3e; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #23211d; stroke: #b8a68a; }
      .jev { fill: #1f2a1b; stroke: #8fbf6a; }
      .t { fill: #efe8d8; }
      .s { fill: #b9ad99; }
      .a { stroke: #b8a68a; }
      .h { fill: #b8a68a; }
      .l { fill: #8fbf6a; }
    }
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker></defs>

  <rect class="box" x="10" y="40" width="150" height="110" rx="12"/>
  <text class="t" x="85" y="80" text-anchor="middle">Your code</text>
  <text class="s" x="85" y="104" text-anchor="middle">any folder or</text>
  <text class="s" x="85" y="122" text-anchor="middle">GitHub repository</text>

  <rect class="box" x="200" y="40" width="170" height="110" rx="12"/>
  <text class="t" x="285" y="80" text-anchor="middle">Engine</text>
  <text class="s" x="285" y="104" text-anchor="middle">reads every folder, file,</text>
  <text class="s" x="285" y="122" text-anchor="middle">function and link</text>

  <rect class="box jev" x="410" y="40" width="170" height="110" rx="12"/>
  <text class="t" x="495" y="80" text-anchor="middle">Jev</text>
  <text class="s" x="495" y="104" text-anchor="middle">judges how much each</text>
  <text class="s" x="495" y="122" text-anchor="middle">part matters, its health,</text>
  <text class="s" x="495" y="140" text-anchor="middle">and what it becomes</text>

  <rect class="box" x="620" y="40" width="160" height="110" rx="12"/>
  <text class="t" x="700" y="80" text-anchor="middle">The world</text>
  <text class="s" x="700" y="104" text-anchor="middle">land laid out from</text>
  <text class="s" x="700" y="122" text-anchor="middle">the code, health</text>
  <text class="s" x="700" y="140" text-anchor="middle">in every leaf</text>

  <rect class="box" x="820" y="40" width="130" height="110" rx="12"/>
  <text class="t" x="885" y="80" text-anchor="middle">You</text>
  <text class="s" x="885" y="104" text-anchor="middle">walk it, read it,</text>
  <text class="s" x="885" y="122" text-anchor="middle">fix it</text>

  <path class="a" d="M160,95 L198,95" marker-end="url(#m)"/>
  <path class="a" d="M370,95 L408,95" marker-end="url(#m)"/>
  <path class="a" d="M580,95 L618,95" marker-end="url(#m)"/>
  <path class="a" d="M780,95 L818,95" marker-end="url(#m)"/>
  <path class="a" d="M885,150 C885,250 285,250 285,152" marker-end="url(#m)"/>
  <text class="l" x="585" y="236" text-anchor="middle">commit a fix, and the open world heals in place</text>
  <text class="s" x="495" y="28" text-anchor="middle">through OpenRouter; every answer is kept</text>
</svg>
