# Pull requests run the type checker, lint, tests, Rust tests and clippy on
# Linux, Windows and macOS. The GPU-backed Electron probe runs on macOS.
name: check

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Keeps cargo's registry and target/ between runs, so the engine builds incrementally.
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --quiet
      - run: cargo clippy --all-targets --quiet -- -D warnings
      # The real app opens the showcase with the engine built above: about two minutes.
      - if: runner.os == 'macOS'
        run: pnpm app-opens

  # The probe in the showcase, from its fixtures, in Electron on a fresh
  # profile: it fails on any WebGL error, such as a far bake whose every draw
  # WebGL rejects, and on a pop in the walk test from either spot. Opening the
  # world takes about nine minutes here, and the walks two more. The swap test
  # stays out: on these runners the frame where a full form gives way to its
  # far form changes a few plants by about one level, at the test's floor, so
  # it passes or fails from run to run.
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm probe drawn steps --world showcase --dpr 1

  # Branch protection requires this stable name as the platform matrix changes.
  required-check:
    name: check
    needs: [check, probe]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all platform checks and the rendering probe
        env:
          PLATFORM_RESULT: ${{ needs.check.result }}
          PROBE_RESULT: ${{ needs.probe.result }}
        run: |
          test "$PLATFORM_RESULT" = success
          test "$PROBE_RESULT" = success
