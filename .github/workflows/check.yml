# The same checks as the pre-commit hook (.githooks/pre-commit), on every pull
# request and every push to main or develop: the type checker, the lint rules and the
# tests, then the engine's tests and clippy; and, on a second runner, the probe
# at one spot. A branch's push isn't checked apart from its pull request, so each
# change takes two macOS runners, not four.
# macOS, because Gaia is a Mac app and its engine keeps the Jev key in the
# Keychain.
name: check

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Keeps cargo's registry and target/ between runs, so the engine builds incrementally.
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --quiet
      - run: cargo clippy --all-targets --quiet -- -D warnings

  # The probe at one spot of Gaia's world, from the fixtures, in Electron on
  # a fresh profile: it fails on any WebGL error, such as a far bake whose
  # every draw WebGL rejects.
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm probe drawn --world gaia --spot valley --dpr 1
