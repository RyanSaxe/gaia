# The link calls' words. Jev chooses which file an import resolves to, or which
# definition a call resolves to, when the rules found several candidates.
# "Outside" is always an option, so Jev never has to place a library import or
# a standard library call on a file in this repository.

[resolve]
instructions = "Which of these does `{text}`, imported on line {line}, refer to? Read the configuration in the state. A manifest's own name, such as the \"name\" in a package.json or the module line of a go.mod, is the package its directory holds. A package a manifest only lists among its dependencies comes from outside this repository, unless another directory's manifest gives that name as its own."
outside = "Something outside this repository: a library, the standard library or the platform."

[callee]
instructions = "Which definition does `{text}`, called on line {line}, reach?"
outside = "Something outside this repository: a library, the standard library or a value passed in."
