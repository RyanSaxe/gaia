# The directory call, asked of each directory once everything under it is
# answered, deepest first, so the root goes last.

[kind]
instructions = "What kind of directory is this? Read its files and subdirectories and choose the one option that describes most of it."
[kind.options]
"library" = "A library: a package or module other code imports."
"application" = "An application: a program people run or deploy."
"feature" = "One feature or area of an application."
"service" = "A backend service or API."
"command-line tool" = "A command-line tool."
"user interface" = "User interface: components, pages and styles."
"core domain" = "The project's central logic: the work only this project does."
"data and storage" = "Data models, storage or persistence."
"shared utilities" = "Small general helpers many parts use."
"types and schemas" = "Types, interfaces or schemas."
"tests" = "Tests, fixtures and test helpers."
"examples or demos" = "Examples or demos of how to use the code."
"documentation" = "Documentation for people to read."
"configuration and infrastructure" = "Configuration, CI, deployment or infrastructure."
"tooling and scripts" = "Developer tooling and scripts."
"generated or vendored" = "Code generated by a tool or copied in from elsewhere."
"assets" = "Images, fonts, media or other static files."
"prompts and agent instructions" = "Prompts or instructions for a language model or an AI agent."

[naming]
instructions = "How well does this directory's name say what it holds?"
levels = [
  "Misleading or empty: a name such as misc, stuff or new, or one that says something the directory doesn't hold.",
  "Vague: the name points roughly the right way but a reader must look inside to know.",
  "Clear: the name says what the directory holds to a reader who knows the project, or leaves out a thing or two it holds.",
  "Exact: a reader new to the project could say what the directory holds from its name alone, and nothing inside is left out.",
]

[cohesion]
instructions = "Does this directory group one concern, with each file where a reader would look for it?"
levels = [
  "A grab bag: unrelated files that share nothing but the directory.",
  "A main concern with files that belong elsewhere.",
  "One main concern with a file or two that could live elsewhere, or that a reader new to the project wouldn't look for here.",
  "Tightly one concern: every file needs the others, and each is where a reader new to the project would look for it.",
]

[doc]
instructions = "How well does the documentation in this directory describe what it holds?"
levels = [
  "Wrong or stale: it describes code that is not here, or an old shape of it.",
  "Thin: it says little more than the directory's name.",
  "Accurate: it describes what is here, with a gap or two.",
  "Accurate and complete: it says what is here, how to use it and how the parts fit.",
]
