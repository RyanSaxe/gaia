# Select key and weak blocks independently; `none` is always an option.
# A separate "finest" question is omitted because it tended to select the
# same block as "most needs work" rather than distinguish useful examples.
[picks.key]
instructions = "Which of these is the key to understanding {what}?"
none = "None stands out: no single one is the key."

[picks.weak]
instructions = "Which of these most needs work in {what}: the one a careful reviewer would fix first?"
none = "None needs work more than the others."

# How the engine gathers quality upward: a container's quality is its
# parts' quality, weighted by their lines, blended with its own.
[gather]
parts = 0.75
own = 0.25

# Asking for more: every request ends with a choice of what would help Jev
# judge it better. Every reading above `threshold` (when "nothing" isn't the
# answer) is added to the state and the same questions are asked again, up
# to `rounds` more times.
[more]
threshold = 0.3
rounds = 1
instructions = "What would help you most to judge this better?"
[more.options]
"usages" = "Where it is used: the lines in other files that call or import it."
"related" = "The source of what it calls in other files."
"tests" = "The tests that reach it."
"docs" = "Its folder's own documentation."
"nothing" = "Nothing: what is here is enough."
