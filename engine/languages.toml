# The engine's only knowledge of languages. Each entry names the extensions
# it reads, where its grammar comes from, and its conventions. A grammar
# compiled into the engine names its crate; `engine/queries/<language>.scm`
# holds our query file for it, run after the grammar's own tags query when
# it ships one.
#
# Any other grammar names the WebAssembly file its own release publishes,
# with that file's SHA-256, and its tags query from the same release when
# the grammar has one. The engine downloads each the first time a project
# needs it, checks the hash and keeps it in the app's data folder. Without
# our query file, such a language falls back: its tags query finds
# definitions and calls, and node kinds such as `if_statement` give blocks.
#
# A convention is a path pattern a language's community follows. A file
# whose path matches one is tagged with it, and the tag goes into Jev's
# state as evidence. It never decides anything on its own.
#
# The import rule reads `relative`: the prefixes that make an import start
# from the importing file's directory ("here"), the one above it ("parent"),
# each directory above it in turn ("ancestors"), or, for Python's leading
# dots, here for one dot and one more directory up for each dot after it
# ("dots"). `in_module = "file"` marks a prefix that, inside a module
# definition such as Rust's `mod tests { }`, names the file holding it,
# since that module is the file's child. A call resolves only to a
# definition in its own language's `family`, which is the language itself
# unless named. `data = true` marks a format that holds configuration rather
# than code, which the import rule searches for package names.
# `implicit_self = true` marks a language whose methods call their own
# class's methods without naming `self` or `this`.

[typescript]
family = "js"
relative = [{ prefix = "./", from = "here" }, { prefix = "../", from = "parent" }]
extensions = ["ts", "mts", "cts"]
grammar = { crate = "tree-sitter-typescript" }
conventions = [
  { tag = "js:test-file", path = "**/*.{test,spec}.*" },
  { tag = "js:test-file", path = "**/__tests__/**" },
  { tag = "ts:declarations", path = "**/*.d.ts" },
]

[tsx]
family = "js"
relative = [{ prefix = "./", from = "here" }, { prefix = "../", from = "parent" }]
extensions = ["tsx"]
grammar = { crate = "tree-sitter-typescript" }
conventions = [
  { tag = "js:test-file", path = "**/*.{test,spec}.*" },
  { tag = "js:test-file", path = "**/__tests__/**" },
  { tag = "js:story", path = "**/*.stories.*" },
]

[javascript]
family = "js"
relative = [{ prefix = "./", from = "here" }, { prefix = "../", from = "parent" }]
extensions = ["js", "jsx", "mjs", "cjs"]
grammar = { crate = "tree-sitter-javascript" }
conventions = [
  { tag = "js:test-file", path = "**/*.{test,spec}.*" },
  { tag = "js:test-file", path = "**/__tests__/**" },
  { tag = "js:story", path = "**/*.stories.*" },
]

[python]
relative = [{ prefix = ".", from = "dots" }]
extensions = ["py", "pyi"]
grammar = { crate = "tree-sitter-python" }
conventions = [
  { tag = "python:test-file", path = "**/test_*.py" },
  { tag = "python:test-file", path = "**/*_test.py" },
  { tag = "pytest:conftest", path = "**/conftest.py" },
  { tag = "python:package-init", path = "**/__init__.py" },
]

[go]
extensions = ["go"]
grammar = { crate = "tree-sitter-go" }
conventions = [
  { tag = "go:test-file", path = "**/*_test.go" },
  { tag = "go:test-data", path = "**/testdata/**" },
]

[rust]
relative = [{ prefix = "self::", from = "here", in_module = "file" }, { prefix = "super::", from = "ancestors", in_module = "file" }, { prefix = "crate::", from = "ancestors" }]
extensions = ["rs"]
grammar = { crate = "tree-sitter-rust" }
conventions = [
  { tag = "rust:integration-test", path = "**/tests/**/*.rs" },
  { tag = "rust:build-script", path = "**/build.rs" },
  { tag = "rust:bench", path = "**/benches/**" },
]

[java]
implicit_self = true
extensions = ["java"]
grammar = { crate = "tree-sitter-java" }
conventions = [
  { tag = "java:test-source", path = "**/src/test/**" },
  { tag = "java:test-file", path = "**/*Test.java" },
]

[c]
family = "c"
extensions = ["c"]
grammar = { crate = "tree-sitter-c" }
conventions = []

[cpp]
implicit_self = true
family = "c"
extensions = ["cc", "cpp", "cxx", "h", "hh", "hpp", "hxx"]
grammar = { crate = "tree-sitter-cpp" }
conventions = []

[c-sharp]
